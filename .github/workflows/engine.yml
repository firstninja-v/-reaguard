name: Engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: node tools/check-upstream.js
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo build --locked
      - run: cargo test --all --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: bash tools/docs-check.sh
        if: runner.os == 'Linux'
      - run: bash tools/docs-check.sh --self-test
        if: runner.os == 'Linux'
      - run: ./target/debug/die-a-rea canary-selftest
        shell: bash
      - run: bash bench/generate.sh && ./target/debug/die-a-rea bench --check
        if: runner.os == 'Linux'
      - run: node tools/engine-smoke.js
        working-directory: .
